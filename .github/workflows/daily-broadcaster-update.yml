name: 📺 Daily Broadcaster Update

on:
  schedule:
    - cron: '21 0 * * *'  # UTC 00:21 = TR 03:21 (gece sonrası)
  workflow_dispatch:

jobs:
  update-broadcasters:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install puppeteer
      
      - name: Install Chrome for Puppeteer
        run: sudo apt-get update && sudo apt-get install -y chromium-browser
      
      - name: Run yayinci.js
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
        run: node yayinci.js
      
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          
          # 🚀 DÜZELTME 1: Sadece yayıncı dosyasını değil, masadaki her şeyi pakete dahil et
          git add .
          
          # 🚀 DÜZELTME 2: Sahneye alınmış bir değişiklik var mı kontrol et
          if ! git diff --staged --quiet; then
            git commit -m "🔄 Auto: Yayıncı bilgileri güncellendi $(date '+%Y-%m-%d %H:%M:%S')"
            
            # Artık ortalık tertemiz olduğu için rebase ASLA hata vermeyecek
            git pull origin main --rebase
            git push
          else
            echo "✅ Herhangi bir değişiklik yok, push edilmedi."
          fi
