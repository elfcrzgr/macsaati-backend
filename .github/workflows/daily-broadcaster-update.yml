name: 📺 Daily Broadcaster Update

on:
  schedule:
    - cron: '21 0 * * *'  # UTC 00:21 = TR 03:21
  workflow_dispatch:

jobs:
  update-broadcasters:
    runs-on: ubuntu-latest
    container:
      image: node:18-bullseye  # Chrome önceden var
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: npm install puppeteer
      
      - name: Run yayinci.js
        run: node yayinci.js
      
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          if ! git diff --quiet yayinci_bilgisi.json; then
            git add yayinci_bilgisi.json
            git commit -m "🔄 Auto: Yayıncı bilgileri güncellendi $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "✅ yayinci_bilgisi.json değişmedi"
          fi
