name: 📺 Daily Broadcaster Update

on:
  schedule:
    - cron: '21 0 * * *'  # Günde 1 kere (saat 03:21 UTC = 06:21 TR, ama EN YAKINI 00:21 TR)
    # NOTE: GitHub Actions UTC saatiyle çalışır. Türkiye UTC+3'tür.
    # Gece 00:00 TR = 21:00 UTC önceki gün
    # Gece 03:00 TR = 00:00 UTC (UTC saat 00:00)
    # Bu cron: UTC 00:21 = TR 03:21 (gece yarısından sonra çalışır)
  workflow_dispatch:

jobs:
  update-broadcasters:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install Chrome for Puppeteer
        run: sudo apt-get update && sudo apt-get install -y chromium-browser
      
      - name: Run yayinci.js
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
        run: node yayinci.js
      
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          if ! git diff --quiet yayinci_bilgisi.json; then
            git add yayinci_bilgisi.json
            git commit -m "🔄 Auto: Yayıncı bilgileri güncellendi $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "✅ yayinci_bilgisi.json değişmedi"
          fi
